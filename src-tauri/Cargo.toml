[package]
name = "json-buddy"
version = "1.0.0"
description = "Local JSON workspace, compare, stream monitor and mock server"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "json_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
notify = "8"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
